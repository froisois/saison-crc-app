name: Appli Android

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']   # la page se charge en ligne : pas de nouvelle appli pour un changement de page
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copie de la page (version hors ligne embarquée)
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          # sans clé fixe, chaque fabrication aurait une signature différente et ne s'installerait pas par-dessus la précédente
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secrets KEYSTORE_B64 et KEYSTORE_PASS absents : ajoute-les dans Settings > Secrets and variables > Actions, puis relance."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/saison.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/saison.p12" >> "$GITHUB_ENV"
      - name: Compilation
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          export KEYSTORE_PASS="$(printf '%s' "$KEYSTORE_PASS" | tr -d ' \t\r\n')"
          gradle -p android assembleRelease --no-daemon
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk saison.apk
          echo "$GITHUB_RUN_NUMBER" > version.txt
          gh release delete android --yes --cleanup-tag || true
          gh release create android saison.apk version.txt \
            --title "Appli Android « Saison »" \
            --notes "Fabrication ${GITHUB_RUN_NUMBER} (commit ${GITHUB_SHA::7})." \
            --target "$GITHUB_SHA"
